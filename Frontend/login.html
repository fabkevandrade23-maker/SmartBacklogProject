<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBacklog — Connexion</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .auth-wrap { width:100%; max-width:440px; padding:24px; }
    .auth-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-xl); padding:36px; }
    .auth-logo { text-align:center; margin-bottom:28px; }
    .logo-big  { width:56px; height:56px; background:linear-gradient(135deg,#6366f1,#818cf8); border-radius:14px; display:inline-flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:12px; }
    .auth-title { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; color:var(--text-primary); }
    .auth-sub   { font-size:12px; color:var(--text-muted); margin-top:4px; }
    .auth-tabs  { display:flex; background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:3px; margin-bottom:24px; }
    .auth-tab   { flex:1; text-align:center; padding:9px; font-size:13px; font-weight:500; border-radius:calc(var(--radius-md) - 1px); cursor:pointer; color:var(--text-muted); transition:all 0.15s; border:none; background:none; font-family:var(--font-sans); }
    .auth-tab.active { background:var(--bg-card); color:var(--text-primary); box-shadow:0 1px 6px rgba(0,0,0,0.3); }
    .auth-panel { display:none; }
    .auth-panel.active { display:block; }
    .msg { border-radius:var(--radius-sm); padding:10px 14px; font-size:13px; margin-bottom:14px; display:none; }
    .msg-error   { background:rgba(244,63,94,0.1); border:1px solid rgba(244,63,94,0.2); color:#fb7185; }
    .msg-success { background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.2); color:#34d399; }
    .pwd-wrap  { position:relative; }
    .pwd-wrap .form-input { padding-right:44px; }
    .pwd-toggle { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:15px; padding:0; transition:color 0.15s; }
    .pwd-toggle:hover { color:var(--text-secondary); }
    .auth-footer { text-align:center; margin-top:20px; font-size:12px; color:var(--text-muted); }
    .auth-footer a { color:var(--accent-light); text-decoration:none; }
    .auth-footer a:hover { text-decoration:underline; }
    .strength-label { font-size:11px; margin-top:4px; transition:color 0.3s; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-big">⚡</div>
      <div class="auth-title">SmartBacklog</div>
      <div class="auth-sub">Assistant IA</div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Connexion</button>
      <button class="auth-tab" onclick="switchTab('register')">Créer un compte</button>
    </div>

    <!-- ── CONNEXION ── -->
    <div class="auth-panel active" id="panel-login">
      <div class="msg msg-error"   id="login-error"></div>
      <div class="msg msg-success" id="login-success"></div>
      <div class="form-group">
        <label class="form-label">Nom d'utilisateur</label>
        <input type="text" class="form-input" id="login-username"
               placeholder="votre_identifiant" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" class="form-input" id="login-password"
                 placeholder="••••••••" autocomplete="current-password" />
          <button class="pwd-toggle" type="button" onclick="togglePwd('login-password',this)">👁</button>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;padding:12px;font-size:15px;margin-top:4px;"
              onclick="login()" id="login-btn">Se connecter</button>
      <div class="auth-footer">
        Pas encore de compte ? <a href="#" onclick="switchTab('register')">Créer un compte</a>
      </div>
    </div>

    <!-- ── INSCRIPTION ── -->
    <div class="auth-panel" id="panel-register">
      <div class="msg msg-error"   id="reg-error"></div>
      <div class="msg msg-success" id="reg-success"></div>
      <div class="form-group">
        <label class="form-label">Nom d'utilisateur <span style="color:var(--rose)">*</span></label>
        <input type="text" class="form-input" id="reg-username"
               placeholder="mon_identifiant" autocomplete="username"
               oninput="validateUsername()" />
        <div class="field-hint" id="username-hint">3 à 20 caractères — lettres, chiffres, _</div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label class="form-label">Prénom</label>
          <input type="text" class="form-input" id="reg-firstname" placeholder="Prénom" />
        </div>
        <div class="form-group">
          <label class="form-label">Nom</label>
          <input type="text" class="form-input" id="reg-lastname" placeholder="Nom" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="reg-email"
               placeholder="email@exemple.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe <span style="color:var(--rose)">*</span></label>
        <div class="pwd-wrap">
          <input type="password" class="form-input" id="reg-password"
                 placeholder="Minimum 6 caractères" autocomplete="new-password"
                 oninput="updateStrength()" />
          <button class="pwd-toggle" type="button" onclick="togglePwd('reg-password',this)">👁</button>
        </div>
        <div class="strength-bar" style="margin-top:6px;">
          <div class="strength-fill" id="strength-fill" style="width:0;"></div>
        </div>
        <div class="strength-label" id="strength-label"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmer le mot de passe <span style="color:var(--rose)">*</span></label>
        <div class="pwd-wrap">
          <input type="password" class="form-input" id="reg-password2"
                 placeholder="••••••••" autocomplete="new-password"
                 oninput="checkMatch()" />
          <button class="pwd-toggle" type="button" onclick="togglePwd('reg-password2',this)">👁</button>
        </div>
        <div class="field-hint" id="match-hint"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;padding:12px;font-size:15px;margin-top:4px;"
              onclick="register()" id="reg-btn">Créer mon compte</button>
      <div class="auth-footer">
        Déjà un compte ? <a href="#" onclick="switchTab('login')">Se connecter</a>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';

function switchTab(tab) {
  ['login','register'].forEach((t,i) => {
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
    document.querySelectorAll('.auth-tab')[i].classList.toggle('active',
      (i===0 && tab==='login') || (i===1 && tab==='register'));
  });
  clearAll();
}

function clearAll() {
  ['login-error','login-success','reg-error','reg-success'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.display='none'; el.textContent=''; }
  });
}

function showMsg(id, text) {
  const el = document.getElementById(id);
  el.textContent = text; el.style.display = 'block';
}

function togglePwd(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? '👁' : '🙈';
}

function validateUsername() {
  const val  = document.getElementById('reg-username').value;
  const hint = document.getElementById('username-hint');
  const inp  = document.getElementById('reg-username');
  const ok   = /^[a-zA-Z0-9_]{3,20}$/.test(val);
  if (!val) { hint.style.color=''; inp.className='form-input'; return; }
  hint.style.color = ok ? '#10b981' : '#f43f5e';
  hint.textContent = ok ? '✓ Nom d\'utilisateur valide' : '✗ 3-20 caractères, lettres/chiffres/_ uniquement';
  inp.className    = 'form-input ' + (ok ? 'input-valid' : 'input-invalid');
}

function updateStrength() {
  const pwd   = document.getElementById('reg-password').value;
  const fill  = document.getElementById('strength-fill');
  const label = document.getElementById('strength-label');
  let score = 0;
  if (pwd.length >= 6)           score++;
  if (pwd.length >= 10)          score++;
  if (/[A-Z]/.test(pwd))        score++;
  if (/[0-9]/.test(pwd))        score++;
  if (/[^a-zA-Z0-9]/.test(pwd)) score++;
  const levels = [
    {pct:'0',   color:'transparent', text:''},
    {pct:'20',  color:'#f43f5e',     text:'Très faible'},
    {pct:'40',  color:'#f59e0b',     text:'Faible'},
    {pct:'60',  color:'#f59e0b',     text:'Moyen'},
    {pct:'80',  color:'#6366f1',     text:'Fort'},
    {pct:'100', color:'#10b981',     text:'Très fort'},
  ];
  const lvl = levels[Math.min(score, 5)];
  fill.style.width      = lvl.pct + '%';
  fill.style.background = lvl.color;
  label.textContent     = lvl.text;
  label.style.color     = lvl.color;
}

function checkMatch() {
  const p1   = document.getElementById('reg-password').value;
  const p2   = document.getElementById('reg-password2').value;
  const hint = document.getElementById('match-hint');
  if (!p2) { hint.textContent=''; return; }
  if (p1 === p2) { hint.textContent='✓ Les mots de passe correspondent'; hint.style.color='#10b981'; }
  else           { hint.textContent='✗ Ne correspondent pas'; hint.style.color='#f43f5e'; }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const active = document.querySelector('.auth-panel.active').id;
  if (active === 'panel-login') login(); else register();
});

async function login() {
  clearAll();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const btn      = document.getElementById('login-btn');
  if (!username || !password) { showMsg('login-error','Veuillez remplir tous les champs.'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Connexion...';
  try {
    const res  = await fetch(`${API}/auth/login`, {
      method: 'POST', body: new URLSearchParams({username, password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Identifiants incorrects.');
    localStorage.setItem('token', data.access_token);
    localStorage.setItem('user', JSON.stringify({username: data.username, role: data.role}));
    window.location.href = 'index.html';
  } catch(e) {
    showMsg('login-error', e.message);
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
}

async function register() {
  clearAll();
  const username  = document.getElementById('reg-username').value.trim();
  const firstname = document.getElementById('reg-firstname').value.trim();
  const lastname  = document.getElementById('reg-lastname').value.trim();
  const email     = document.getElementById('reg-email').value.trim();
  const password  = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;
  const btn       = document.getElementById('reg-btn');

  if (!username || !password)   { showMsg('reg-error','Le nom d\'utilisateur et le mot de passe sont obligatoires.'); return; }
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { showMsg('reg-error','Nom d\'utilisateur invalide (3-20 caractères, lettres/chiffres/_).'); return; }
  if (password.length < 6)      { showMsg('reg-error','Le mot de passe doit contenir au moins 6 caractères.'); return; }
  if (password !== password2)   { showMsg('reg-error','Les mots de passe ne correspondent pas.'); return; }

  const full_name = [firstname, lastname].filter(Boolean).join(' ') || username;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Création en cours...';

  try {
    const res  = await fetch(`${API}/auth/register`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username, password, full_name, email}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Erreur lors de la création du compte.');
    const isAdmin = data.role === 'admin';
    showMsg('reg-success',
      `✓ Compte créé !${isAdmin ? ' Vous êtes le premier utilisateur et devenez administrateur.' : ''} Redirection...`
    );
    setTimeout(() => {
      document.getElementById('login-username').value = username;
      switchTab('login');
    }, 2000);
  } catch(e) {
    showMsg('reg-error', e.message);
  }
  btn.disabled = false; btn.textContent = 'Créer mon compte';
}
</script>
</body>
</html>
